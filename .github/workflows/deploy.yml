# Redeploys the site to GitHub Pages when the page itself changes, using the
# data/datasets.json already committed. Fetching new data is refresh.yml's job.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - style.css
      - og-image.png
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with refresh.yml so the two never deploy to Pages at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm test

      - run: npm run site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
